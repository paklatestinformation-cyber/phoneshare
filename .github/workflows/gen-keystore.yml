name: Generate signing key (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Generate stable keystore
        run: |
          keytool -genkeypair -keystore /tmp/nexlink.jks -alias nexlink \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nexlink2026 -keypass nexlink2026 \
            -dname "CN=NexLink, OU=Personal, O=Muhammad Kamran Malik, L=Lahore, ST=Punjab, C=PK" \
            -noprompt
          mkdir -p app
          base64 -w0 /tmp/nexlink.jks > app/nexlink.jks.b64
      - name: Commit keystore to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/nexlink.jks.b64
          if git diff --cached --quiet; then echo "keystore already committed"; else git commit -m "ci: stable signing keystore for in-place updates"; git push; fi
