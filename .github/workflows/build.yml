name: Build APK
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: Check browser JS syntax
        run: |
          python3 -c "import re;h=open('app/src/main/assets/index.html').read();open('/tmp/inline.js','w').write(re.search(r'<script>(.*?)</script>',h,re.S).group(1))"
          node --check /tmp/inline.js
      - name: Decode stable signing key
        run: base64 -d app/nexlink.jks.b64 > app/nexlink.jks
      - name: Read version name
        run: |
          VER=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
      - run: gradle assembleRelease --no-daemon
      - name: Prepare signed APK
        run: cp app/build/outputs/apk/release/app-release.apk NexLink.apk
      - uses: actions/upload-artifact@v4
        with: { name: NexLink, path: NexLink.apk }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: NexLink v${{ env.APP_VERSION }}
          files: NexLink.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
