plugins { id 'com.android.application' }
android {
    namespace 'com.zyvo.phoneshare'
    compileSdk 34
    signingConfigs {
        // Fixed key: every update keeps the same signature, so Android upgrades
        // in place and the app's data (shared files) is never wiped.
        release {
            storeFile file("nexlink.jks")
            storePassword "nexlink2026"
            keyAlias "nexlink"
            keyPassword "nexlink2026"
        }
    }
    defaultConfig {
        applicationId 'com.zyvo.phoneshare'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "2.1"
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { viewBinding true }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
