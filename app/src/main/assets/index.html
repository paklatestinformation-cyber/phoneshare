<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexLink</title>
<style>
:root{--accent:#06B6D4;--on-accent:#fff;--bg:#F1F5F9;--card:#fff;--text1:#0F172A;--text2:#475569;--line:#CBD5E1;--danger:#EF4444;--ok:#10B981;--radius:16px;--pad:16px;--gap:12px}
@media(prefers-color-scheme:dark){:root{--bg:#020617;--card:#0F172A;--text1:#E2E8F0;--text2:#94A3B8;--line:#1E293B}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text1);font:400 15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;padding:var(--pad)}
.header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.logo svg{width:26px;height:26px}
h1{font-size:20px;font-weight:700;margin:0}
.sub{color:var(--text2);font-size:13px;margin:2px 0 0}
.card{background:var(--card);border-radius:var(--radius);padding:var(--pad);margin-bottom:var(--gap)}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.icon{width:56px;height:56px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;position:relative;overflow:hidden}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.icon img.ok{display:block}
.icon .badge{position:relative;z-index:2;letter-spacing:.04em}
.icon.has-img .badge{position:absolute;right:3px;bottom:3px;background:rgba(2,6,23,.72);border-radius:5px;padding:1px 4px;font-size:8px}
.icon.video.has-img::after{content:"\25B6";position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:rgba(2,6,23,.55);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding-left:2px}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--text2)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer}
.btn.out{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:var(--danger)}
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:22px;padding:0 16px;background:var(--card);color:var(--text1);margin-bottom:12px}
.upload{border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;color:var(--text2);margin-bottom:12px;cursor:pointer;user-select:none}
.upstat{font-size:13px;color:var(--text2)}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px;display:none}
.progress>div{height:100%;background:var(--accent);width:0%;transition:width .2s}
.pct{text-align:center;font-size:12px;color:var(--text2);margin-top:4px;display:none}
.preview{max-width:100%;max-height:70vh;border-radius:12px;margin:8px 0}
.empty{text-align:center;color:var(--text2);padding:40px 0}
.dev{text-align:center;padding:24px 0;color:var(--text2);font-size:12px}
.dev a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
      <path fill="#fff" d="M34 28h4a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8V36a8 8 0 0 1 8-8Z"/>
      <path fill="#fff" d="M70 28h4a8 8 0 0 1 8 8v36a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8V36a8 8 0 0 1 8-8Z"/>
      <path fill="#fff" d="M41 49h26a5 5 0 0 1 5 5 5 5 0 0 1-5 5H41a5 5 0 0 1-5-5 5 5 0 0 1 5-5Z"/>
      <path fill="#06B6D4" d="M31 54a5 5 0 1 0 10 0 5 5 0 1 0-10 0Zm36 0a5 5 0 1 0 10 0 5 5 0 1 0-10 0Z"/>
    </svg>
  </div>
  <div>
    <h1>NexLink</h1>
    <div class="sub">Shared files from this device</div>
  </div>
</div>
<input id="search" class="search" placeholder="Search files..." oninput="render()">
<div class="upload" id="drop" role="button" tabindex="0">
  <div class="upstat" id="upstat">Click to choose files or drag &amp; drop here</div>
  <input type="file" id="fileInput" multiple style="display:none">
  <div class="progress" id="prog"><div id="bar"></div></div>
  <div class="pct" id="pct">0%</div>
</div>
<div id="list"></div>
<div class="empty" id="empty" style="display:none">No shared files yet</div>

<div class="dev">
  Developer: <b>Muhammad Kamran Malik</b><br>
  <a href="tel:+923135275771">+923135275771</a>
</div>

<script>
let items = [];
let lastSig = '';
const $ = id => document.getElementById(id);

function signature(arr) {
  return arr.map(i => i.name + '|' + i.size + '|' + i.lastModified).join('\n');
}

async function load() {
  try {
    const r = await fetch('/api/list?path=');
    const d = await r.json();
    const next = d.items || [];
    const sig = signature(next);
    if (sig === lastSig) return; // no change -> skip re-render (no flicker)
    lastSig = sig;
    items = next;
    render();
  } catch (e) { /* network hiccup, retry next poll */ }
}

const IMAGE_EXT = new Set(['png','jpg','jpeg','gif','webp','bmp']);
const VIDEO_EXT = new Set(['mp4','mov','mkv','webm','3gp']);
const PREVIEW_EXT = new Set([...IMAGE_EXT,...VIDEO_EXT,'pdf']);
const LABELS = {png:'PNG',jpg:'JPG',jpeg:'JPG',gif:'GIF',webp:'WEB',bmp:'BMP',
  pdf:'PDF',mp4:'MP4',mov:'MOV',mkv:'MKV',webm:'WEB','3gp':'3GP',
  mp3:'MP3',zip:'ZIP',txt:'TXT',json:'JSON'};
function extLabel(ext){const e=(ext||'').toLowerCase();return LABELS[e]||(e.slice(0,3).toUpperCase()||'FILE');}

function fmtSize(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(1)+' GB';}
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString();}

function render() {
  const q = $('search').value.toLowerCase();
  const filtered = items.filter(i => i.name.toLowerCase().includes(q));
  const list = $('list'); list.innerHTML = '';
  $('empty').style.display = filtered.length ? 'none' : 'block';
  filtered.forEach(it => {
    const row = document.createElement('div'); row.className='row';
    const ic = document.createElement('div'); ic.className = 'icon';
    const e = (it.ext || '').toLowerCase();
    if (!it.isDir && PREVIEW_EXT.has(e)) {
      if (VIDEO_EXT.has(e)) ic.classList.add('video');
      const img = document.createElement('img');
      img.alt = '';
      img.src = '/thumb/' + encodeURIComponent(it.relPath);
      img.onload = () => { img.classList.add('ok'); ic.classList.add('has-img'); };
      img.onerror = () => { img.remove(); };
      ic.appendChild(img);
    }
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = it.isDir ? 'DIR' : extLabel(e);
    ic.appendChild(badge);
    const grow = document.createElement('div'); grow.className='grow';
    const nm = document.createElement('div'); nm.className='name'; nm.textContent = it.name;
    const mt = document.createElement('div'); mt.className='meta';
    mt.textContent = fmtSize(it.size) + '  •  ' + fmtDate(it.lastModified);
    grow.appendChild(nm); grow.appendChild(mt);
    const acts = document.createElement('div'); acts.className='actions';
    const view = document.createElement('button'); view.className='btn out'; view.textContent='View';
    view.onclick = () => viewFile(it.relPath, it.ext);
    const dl = document.createElement('button'); dl.className='btn'; dl.textContent='Download';
    dl.onclick = () => { location.href = '/download/' + encodeURIComponent(it.relPath); };
    const pr = document.createElement('button'); pr.className='btn out'; pr.textContent='Print';
    pr.onclick = () => printFile(it.relPath);
    const del = document.createElement('button'); del.className='btn danger'; del.textContent='Delete';
    del.onclick = async () => { if(!confirm('Delete '+it.name+'?'))return;
      await fetch('/api/delete?path='+encodeURIComponent(it.relPath));
      load(); };
    acts.appendChild(view); acts.appendChild(dl); acts.appendChild(pr); acts.appendChild(del);
    row.appendChild(ic); row.appendChild(grow); row.appendChild(acts);
    list.appendChild(row);
  });
}

async function viewFile(rel, ext) {
  const e = (ext||'').toLowerCase();
  if (['png','jpg','jpeg','gif','webp'].includes(e)) {
    const img = document.createElement('img'); img.className='preview'; img.src='/view/'+encodeURIComponent(rel);
    showModal(img);
  } else if (e === 'pdf') {
    const iframe = document.createElement('iframe'); iframe.className='preview'; iframe.style.width='100%'; iframe.style.height='70vh';
    iframe.src='/view/'+encodeURIComponent(rel);
    showModal(iframe);
  } else if (['txt','json','csv','log','md'].includes(e)) {
    const r = await fetch('/view/'+encodeURIComponent(rel)); const t = await r.text();
    const pre = document.createElement('pre'); pre.style.whiteSpace='pre-wrap'; pre.textContent = t.slice(0,20000);
    showModal(pre);
  } else {
    window.open('/view/'+encodeURIComponent(rel));
  }
}

function showModal(node) {
  const m = document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px';
  const box = document.createElement('div');
  box.style.cssText='background:var(--card);border-radius:16px;padding:16px;max-width:95vw;max-height:95vh;overflow:auto';
  const close = document.createElement('button'); close.className='btn'; close.textContent='Close'; close.style.marginBottom='8px';
  close.onclick = () => m.remove();
  box.appendChild(close); box.appendChild(node);
  m.appendChild(box); m.onclick = (e) => { if(e.target===m) m.remove(); };
  document.body.appendChild(m);
}

function printFile(rel) {
  const w = window.open('/view/'+encodeURIComponent(rel));
  if (w) { w.onload = () => { w.print(); }; }
}

const drop = $('drop');
const fileInput = $('fileInput');
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
drop.addEventListener('dragover', e => { e.preventDefault(); drop.style.borderColor='var(--accent)'; });
drop.addEventListener('dragleave', () => drop.style.borderColor='var(--line)');
drop.addEventListener('drop', e => { e.preventDefault(); drop.style.borderColor='var(--line)'; uploadFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => uploadFiles(e.target.files));

async function uploadFiles(files) {
  if (!files || !files.length) return;
  let ok = 0, fail = 0;
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f, f.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload?path=&filename=' + encodeURIComponent(f.name));
    $('prog').style.display='block'; $('pct').style.display='block';
    $('upstat').textContent = 'Uploading ' + f.name + '…';
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        const p = Math.round(e.loaded/e.total*100);
        $('bar').style.width = p+'%';
        $('pct').textContent = p+'%  —  '+f.name;
      }
    };
    xhr.onload = () => {
      $('prog').style.display='none'; $('pct').style.display='none'; $('bar').style.width='0%';
      if (xhr.status >= 200 && xhr.status < 300) { ok++; $('upstat').textContent = 'Uploaded ' + ok + ' file(s)'; }
      else { fail++; $('upstat').textContent = 'Upload failed (' + xhr.status + ')'; }
      load();
    };
    xhr.onerror = () => { fail++; $('upstat').textContent = 'Upload failed: network error'; };
    xhr.send(fd);
  }
  fileInput.value = '';
}

load();
// Auto-refresh: poll server every 3s so files shared from phone appear without manual refresh
setInterval(load, 3000);
</script>
</body>
</html>
